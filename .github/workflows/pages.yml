name: Deploy website

on:
  push:
    branches: [main, claude/intelligent-turing-s26ab5]
    paths:
      - 'web/**'
      - 'engine/**'
      - 'nnue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build the WebAssembly engine
        run: web/build.sh

      - name: Smoke-test the WebAssembly engine
        run: node web/test/wasm_test.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web/index.html web/css web/js web/fonts web/net web/wasm-dist _site/
          touch _site/.nojekyll
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
