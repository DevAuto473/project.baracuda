name: Deploy website

on:
  push:
    branches: [main, DevAuto473]
    paths:
      - 'web/**'
      - 'engine/**'
      - 'nnue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build the WebAssembly engine
        run: web/build.sh

      - name: Smoke-test the WebAssembly engine
        run: node web/test/wasm_test.mjs

      - name: Check the stylesheet
        run: node web/test/css_check.mjs

      - name: Check the installable app (manifest, icons, files stored for offline play)
        run: node web/test/pwa_check.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web/index.html web/config.json web/manifest.webmanifest web/sw.js web/css web/js web/img web/fonts web/net web/wasm-dist _site/
          touch _site/.nojekyll
          # cache-busting: every asset URL carries the commit id
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html _site/sw.js _site/manifest.webmanifest _site/js/*.js
          grep -q "${GITHUB_SHA::8}" _site/index.html && grep -q "${GITHUB_SHA::8}" _site/js/app.js && grep -q "${GITHUB_SHA::8}" _site/sw.js && ! grep -q "__BUILD__" _site/sw.js && echo "assets stamped with ${GITHUB_SHA::8}"
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
